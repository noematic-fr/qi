<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pioche</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="img/sheeps.jpg" />
    <link rel="apple-touch-icon" href="img/sheeps.jpg" />
    <link rel="stylesheet" href="app.css" />
    <script>
      window.goatcounter = { no_events: true };
      if (new URLSearchParams(location.search).has("gc")) {
        window.goatcounter.allow_local = true;
      }
    </script>
    <script
      data-goatcounter="https://qi.gc.noematic.eu/count"
      async
      src="https://qi.noematic.eu/count.min.js"
    ></script>
  </head>
  <body>
    <main id="app">
      <header class="top">
        <p class="brand">Pioche</p>
        <p id="prompt" class="prompt">Choisis celle qui te plaît.</p>
      </header>
      <section id="hand" class="hand" aria-label="Trois cartes"></section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
