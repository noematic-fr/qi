<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="grass" cx="48%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#D8EAC2"/>
      <stop offset="50%" stop-color="#C8DDB0"/>
      <stop offset="100%" stop-color="#A8C48A"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141810" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#141810" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#141810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wool" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#FFFCF5"/>
      <stop offset="50%" stop-color="#F3EDE0"/>
      <stop offset="100%" stop-color="#C9BBA8"/>
    </radialGradient>
    <radialGradient id="dog" cx="42%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#3D2C22"/>
      <stop offset="50%" stop-color="#2A1F18"/>
      <stop offset="100%" stop-color="#1A120E"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#grass)"/>

  <!--
    Cluster centered: sheep pair left, dog right/slightly above.
    Local coords designed around origin; then scale+translate to fill icon.
    Scale ~1.55 vs previous, less empty pasture.
  -->
  <g transform="translate(256 274) scale(1.72)">
    <!-- shadows under feet -->
    <ellipse cx="-58" cy="50" rx="48" ry="16" fill="url(#shadow)"/>
    <ellipse cx="-8" cy="56" rx="40" ry="14" fill="url(#shadow)"/>
    <ellipse cx="52" cy="40" rx="58" ry="18" fill="url(#shadow)"/>

    <!-- Sheep A — left, slightly back -->
    <g transform="translate(-62 16)">
      <ellipse cx="-4" cy="12" rx="52" ry="40" fill="#C9BBA8"/>
      <ellipse cx="2" cy="2" rx="50" ry="38" fill="url(#wool)"/>
      <ellipse cx="18" cy="-12" rx="24" ry="20" fill="#FFFCF5"/>
      <ellipse cx="38" cy="6" rx="18" ry="15" fill="#7A5A48"/>
      <ellipse cx="40" cy="4" rx="13" ry="11" fill="#4A3428"/>
      <circle cx="47" cy="2" r="3.4" fill="#1A1210"/>
      <ellipse cx="-18" cy="36" rx="6" ry="10" fill="#3E2C22"/>
      <ellipse cx="14" cy="38" rx="6" ry="10" fill="#3E2C22"/>
      <circle cx="26" cy="20" r="6" fill="#E8A54B"/>
      <circle cx="27.5" cy="18.2" r="2.2" fill="#FFE08A"/>
    </g>

    <!-- Sheep B — front, nestled against dog -->
    <g transform="translate(-2 28)">
      <ellipse cx="-2" cy="10" rx="46" ry="36" fill="#C9BBA8"/>
      <ellipse cx="4" cy="0" rx="44" ry="34" fill="url(#wool)"/>
      <ellipse cx="16" cy="-14" rx="20" ry="17" fill="#FFFCF5"/>
      <ellipse cx="34" cy="4" rx="16" ry="13" fill="#7A5A48"/>
      <ellipse cx="36" cy="2" rx="12" ry="10" fill="#4A3428"/>
      <circle cx="42" cy="0" r="3" fill="#1A1210"/>
      <ellipse cx="-14" cy="32" rx="5" ry="9" fill="#3E2C22"/>
      <ellipse cx="14" cy="34" rx="5" ry="9" fill="#3E2C22"/>
      <circle cx="22" cy="16" r="5.5" fill="#E8A54B"/>
      <circle cx="23.5" cy="14.3" r="2" fill="#FFE08A"/>
    </g>

    <!-- Dog — right, facing sheep, close pack -->
    <g transform="translate(56 4)">
      <!-- tail (rear / right) -->
      <ellipse cx="52" cy="-8" rx="20" ry="9" fill="#2A1F18" transform="rotate(28 52 -8)"/>
      <ellipse cx="64" cy="-14" rx="10" ry="5.5" fill="#F0E6D8" transform="rotate(28 64 -14)"/>
      <!-- body -->
      <ellipse cx="8" cy="14" rx="58" ry="30" fill="#1A120E"/>
      <ellipse cx="0" cy="4" rx="56" ry="28" fill="url(#dog)"/>
      <ellipse cx="18" cy="-4" rx="22" ry="13" fill="#3D2C22" opacity="0.8"/>
      <!-- head (left / toward sheep) -->
      <ellipse cx="-46" cy="0" rx="26" ry="18" fill="#2A1F18"/>
      <!-- ear flopped sideways -->
      <ellipse cx="-34" cy="-14" rx="12" ry="14" fill="#2A1F18" transform="rotate(-18 -34 -14)"/>
      <ellipse cx="-34" cy="-12" rx="6" ry="8" fill="#C4897A" transform="rotate(-18 -34 -12)"/>
      <!-- blaze + muzzle -->
      <ellipse cx="-56" cy="0" rx="15" ry="12" fill="#F0E6D8"/>
      <ellipse cx="-60" cy="5" rx="11" ry="7.5" fill="#D4C4B0"/>
      <ellipse cx="-68" cy="7" rx="6" ry="3.8" fill="#1A1210"/>
      <!-- eye -->
      <circle cx="-50" cy="-5" r="4.2" fill="#F0C14A"/>
      <circle cx="-51" cy="-5.5" r="1.6" fill="#1A1210"/>
      <!-- collar + bell -->
      <rect x="-20" y="12" width="18" height="11" rx="4" fill="#F0B429"/>
      <rect x="-20" y="12" width="18" height="4" rx="1.5" fill="#FFE08A" opacity="0.5"/>
      <circle cx="-11" cy="28" r="6" fill="#E8A54B"/>
      <circle cx="-10" cy="26.2" r="2.2" fill="#FFE08A"/>
      <!-- chest / paw -->
      <ellipse cx="-16" cy="24" rx="11" ry="7" fill="#F0E6D8" opacity="0.92"/>
      <ellipse cx="-24" cy="34" rx="8" ry="5.5" fill="#F0E6D8"/>
    </g>
  </g>
</svg>
