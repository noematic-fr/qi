<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Movie-poster hero frame:
    Diagonal chase line ↘→↖
    Dog (star) lower-right lunges left.
    Lead sheep mid-left faces the threat.
    Trail sheep upper-left flees, smaller, opposite angle.
  -->
  <defs>
    <radialGradient id="grass" cx="48%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#D8EAC2"/>
      <stop offset="50%" stop-color="#C8DDB0"/>
      <stop offset="100%" stop-color="#A8C48A"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141810" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#141810" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#141810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wool" cx="36%" cy="30%" r="64%">
      <stop offset="0%" stop-color="#FFFCF5"/>
      <stop offset="48%" stop-color="#F3EDE0"/>
      <stop offset="100%" stop-color="#C9BBA8"/>
    </radialGradient>
    <radialGradient id="dog" cx="40%" cy="34%" r="64%">
      <stop offset="0%" stop-color="#3D2C22"/>
      <stop offset="48%" stop-color="#2A1F18"/>
      <stop offset="100%" stop-color="#1A120E"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#grass)"/>

  <!-- Sheep A — trail / upper-left, fleeing up-left, distinct pose -->
  <g transform="translate(178 178) rotate(-28) scale(0.92)">
    <ellipse cx="0" cy="36" rx="40" ry="12" fill="url(#shadow)"/>
    <ellipse cx="8" cy="8" rx="38" ry="28" fill="#C9BBA8"/>
    <ellipse cx="0" cy="-2" rx="36" ry="26" fill="url(#wool)"/>
    <ellipse cx="-10" cy="-12" rx="15" ry="12" fill="#FFFCF5"/>
    <!-- head left (escape) -->
    <ellipse cx="-26" cy="0" rx="13" ry="11" fill="#7A5A48"/>
    <ellipse cx="-28" cy="-2" rx="10" ry="8" fill="#4A3428"/>
    <circle cx="-33" cy="-3" r="2.4" fill="#1A1210"/>
    <ellipse cx="12" cy="24" rx="4" ry="7" fill="#3E2C22"/>
    <ellipse cx="-6" cy="26" rx="4" ry="7" fill="#3E2C22"/>
    <circle cx="-14" cy="12" r="4" fill="#E8A54B"/>
    <circle cx="-12.8" cy="10.8" r="1.5" fill="#FFE08A"/>
  </g>

  <!-- Sheep B — lead sheep, mid-left, faces dog (drama) -->
  <g transform="translate(176 278) rotate(6) scale(1.08)">
    <ellipse cx="2" cy="46" rx="54" ry="16" fill="url(#shadow)"/>
    <ellipse cx="-4" cy="10" rx="52" ry="38" fill="#C9BBA8"/>
    <ellipse cx="2" cy="-2" rx="50" ry="36" fill="url(#wool)"/>
    <ellipse cx="16" cy="-16" rx="22" ry="18" fill="#FFFCF5"/>
    <!-- face toward dog (right) -->
    <ellipse cx="36" cy="2" rx="19" ry="15" fill="#7A5A48"/>
    <ellipse cx="40" cy="0" rx="13" ry="11" fill="#4A3428"/>
    <circle cx="46" cy="-2" r="3.2" fill="#1A1210"/>
    <circle cx="38" cy="-5" r="2.2" fill="#1A1210" opacity="0.5"/>
    <ellipse cx="-14" cy="34" rx="6" ry="10" fill="#3E2C22"/>
    <ellipse cx="14" cy="36" rx="6" ry="10" fill="#3E2C22"/>
    <circle cx="24" cy="16" r="6" fill="#E8A54B"/>
    <circle cx="25.8" cy="14.2" r="2.2" fill="#FFE08A"/>
  </g>

  <!-- Dog — poster hero, large, lower-right, lunges toward sheep -->
  <g transform="translate(328 300) rotate(-18) scale(1.12)">
    <ellipse cx="4" cy="40" rx="74" ry="20" fill="url(#shadow)"/>
    <!-- tail up-right (motion arc) -->
    <ellipse cx="58" cy="-22" rx="22" ry="9" fill="#2A1F18" transform="rotate(48 58 -22)"/>
    <ellipse cx="70" cy="-32" rx="11" ry="5.5" fill="#F0E6D8" transform="rotate(48 70 -32)"/>
    <!-- stretched body -->
    <ellipse cx="12" cy="12" rx="66" ry="32" fill="#1A120E"/>
    <ellipse cx="0" cy="0" rx="64" ry="30" fill="url(#dog)"/>
    <ellipse cx="20" cy="-10" rx="24" ry="14" fill="#3D2C22" opacity="0.85"/>
    <!-- head low thrust left -->
    <ellipse cx="-52" cy="-2" rx="30" ry="20" fill="#2A1F18"/>
    <!-- ear blown back -->
    <ellipse cx="-38" cy="-20" rx="11" ry="15" fill="#2A1F18" transform="rotate(32 -38 -20)"/>
    <ellipse cx="-38" cy="-18" rx="5.5" ry="8" fill="#C4897A" transform="rotate(32 -38 -18)"/>
    <!-- blaze + muzzle -->
    <ellipse cx="-66" cy="0" rx="17" ry="13" fill="#F0E6D8"/>
    <ellipse cx="-72" cy="5" rx="12" ry="8" fill="#D4C4B0"/>
    <ellipse cx="-82" cy="7" rx="6.5" ry="4" fill="#1A1210"/>
    <!-- eye -->
    <circle cx="-58" cy="-7" r="5" fill="#F0C14A"/>
    <circle cx="-59.5" cy="-7.5" r="1.9" fill="#1A1210"/>
    <!-- collar -->
    <rect x="-26" y="10" width="20" height="12" rx="4" fill="#F0B429"/>
    <rect x="-26" y="10" width="20" height="4" rx="2" fill="#FFE08A" opacity="0.55"/>
    <circle cx="-15" cy="28" r="6.5" fill="#E8A54B"/>
    <circle cx="-13.5" cy="26" r="2.3" fill="#FFE08A"/>
    <!-- chest + front paw reaching left -->
    <ellipse cx="-20" cy="20" rx="13" ry="8" fill="#F0E6D8" opacity="0.95"/>
    <ellipse cx="-50" cy="26" rx="13" ry="7" fill="#F0E6D8"/>
    <!-- rear paw -->
    <ellipse cx="30" cy="28" rx="10" ry="6.5" fill="#2A1F18"/>
  </g>
</svg>
